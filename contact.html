  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand-name">jacob perry</span>
      <span class="brand-tagline">a portfolio website</span>
    </a>

    <button
      class="menu-toggle"
      id="menuToggle"
      aria-expanded="false"
      aria-controls="siteNav"
      aria-label="Open menu"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <div class="nav-overlay" id="navOverlay"></div>

  <nav class="site-nav" id="siteNav" aria-label="Primary">
    <ul>
      <li><a href="projects.html">projects</a></li>
      <li><a href="images.html">images</a></li>
      <li><a href="videos.html">videos</a></li>
      <li><a href="about.html">about</a></li>
      <li><a href="contact.html">contact</a></li>
    </ul>
  </nav>

  <main>
    <section class="page-intro">
      <h1>Contact</h1>
    </section>

    <section class="contact-form-wrap">
      <div id="formStatus" class="form-status" role="status" aria-live="polite">
        <span id="formStatusText" class="form-status-text"></span>
        <button type="button" id="formStatusClose" class="form-status-close" aria-label="Dismiss">&times;</button>
      </div>

      <form
        id="contactForm"
        class="contact-form"
        action="https://api.web3forms.com/submit"
        method="POST"
      >
        <input type="hidden" name="access_key" value="b741d18a-fd2e-4e1d-96b4-436f6fcd9520" />
        <input type="hidden" name="subject" value="New message from jacobperry.net" />
        <input type="hidden" name="redirect" value="https://jacobperry.net/contact.html?sent=1" />
        <input type="checkbox" name="botcheck" class="visually-hidden" tabindex="-1" autocomplete="off" />

        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="form-submit">Send message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> Jacob Perry</span>
    <span class="site-footer-links">
      <a href="about.html#resume">Resume</a>
      <a href="contact.html">Get in touch</a>
    </span>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
